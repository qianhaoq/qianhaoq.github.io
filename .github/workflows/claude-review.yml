name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 注意：不是 anthropic_api_key
          prompt: |
            请用中文 review 这个 PR。无论是否发现问题，都必须给出明确结论。

            当前仓库：${{ github.repository }}
            当前 PR：#${{ github.event.pull_request.number }}
            当前 HEAD SHA：${{ github.event.pull_request.head.sha }}

            重点关注：
            - 是否会导致公开站点构建失败或草稿泄露
            - RSS/sitemap/search 是否暴露了草稿或错误内容
            - 用户可见行为改动是否同步了 BDD 场景
            - 是否违反 GitHub Pages 纯静态边界（新增后台路由、保存 token、模拟登录态）

            如果没有需要修改的问题，verdict 必须是 PASS。
            如果发现需要修改的问题，verdict 必须是 FAIL，并在 findings 中给出具体文件路径和可复现的验证方式。
          claude_args: |
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["PASS","FAIL"]},"summary":{"type":"string"},"head_sha":{"type":"string"},"findings":{"type":"array","items":{"type":"object","properties":{"severity":{"type":"string","enum":["CRITICAL","HIGH","MEDIUM","LOW"]},"file":{"type":"string"},"description":{"type":"string"},"verification":{"type":"string"}},"required":["severity","file","description","verification"],"additionalProperties":false}}},"required":["verdict","summary","head_sha","findings"],"additionalProperties":false}'

      - id: claude-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CLAUDE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAUDE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write

      - name: Post Claude review summary
        env:
          GH_TOKEN: ${{ steps.claude-bot-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLAUDE_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail

          if [ -z "${CLAUDE_OUTPUT}" ]; then
            echo "Claude did not return structured_output."
            exit 1
          fi

          output_file="$(mktemp)"
          comment_file="$(mktemp)"
          printf '%s' "${CLAUDE_OUTPUT}" > "${output_file}"

          verdict="$(jq -r '.verdict // "FAIL"' "${output_file}")"
          summary="$(jq -r '.summary // ""' "${output_file}")"
          findings="$(jq -r '
            if (.findings | length) == 0 then
              "- 无需要修改的问题。"
            else
              .findings[]
              | "- [" + .severity + "] " + .file + ": " + .description + "\n  验证: " + .verification
            end
          ' "${output_file}")"

          {
            echo "## Claude Code Review"
            echo
            echo "Head SHA: ${HEAD_SHA}"
            echo "Verdict: ${verdict}"
            echo
            echo "${summary}"
            echo
            echo "### Findings"
            echo "${findings}"
          } > "${comment_file}"

          gh pr comment "${PR_NUMBER}" --body-file "${comment_file}"

          if [ "${verdict}" != "PASS" ]; then
            echo "Claude review verdict is ${verdict}."
            exit 1
          fi
